[project]
name = "herdrelay"
version = "0.1.0"
description = "HerdRelay — local chat transports for Herdr runtimes and agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "discord.py>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
voice-mlx = [
  "mlx-whisper>=0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
herdrelay = "herdrelay.main:main"
herdrelay-telegram = "herdrelay.telegram_main:main"
herdrelay-targets = "herdrelay.target_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

