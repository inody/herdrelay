runtime:
  provider: herdr-tui           # herdr-tui (current default) or herdr-core (experimental)
  core:
    socket_path: null             # existing Core only; never starts one
    connect_timeout_seconds: 5
    request_timeout_seconds: 20
    event_idle_timeout_seconds: 35 # Core heartbeats every 15s
    require_app_visible: true
    include_hidden_workers: false
    include_connected_machines: false
    allowed_terminal_addresses: [] # empty denies all Core targets; list exact t-addresses

transports:
  telegram:
    enabled: false
    mode: forum
    allowed_chat_ids: []
    allowed_user_ids: []
    forum_chat_id: null
    statuses: [blocked, done]
    enable_send: false
    poll_timeout_seconds: 25
    request_timeout_seconds: 35
    reconnect_delay_seconds: 5

allowed_guild_ids: []
allowed_channel_ids: []
allowed_user_ids: []
thread_parent_channel_id: null

database_path: herdrelay.sqlite3

max_output_chars: 1800
max_message_chars: 2000

enable_send: false
enable_approve: false
enable_watcher: false          # Core uses events.subscribe; TUI uses legacy socket
enable_stop: false             # Core: terminal.interrupt only; TUI: configured stop strategy
enable_auto_threads: false
enable_streaming: false
allow_pane_send_fallback: false

auto_threads:
  refresh_seconds: 30

streaming:
  mode: hooks                  # hooks (recommended) or poll
  refresh_seconds: 8           # poll mode only
  tail_lines: 1000             # poll mode only
  initial_tail_lines: 60       # poll mode only
  enable_visible_fallback: true # poll mode only
  hook_inbox_path: ~/.cache/herdrelay/agent-output
  hook_refresh_seconds: 1
  hook_max_event_bytes: 2000000
  hook_max_event_age_seconds: 86400

watcher:
  statuses: ["blocked", "done"]
  reconnect_delay_seconds: 5
  resubscribe_interval_seconds: 300
  include_output: true
  blocked_notification_delay_seconds: 1.5 # lets agent question hooks arrive first
  blocked_tail_lines: 80
  done_tail_lines: 60
dangerous_text_blocklist:
  - "rm -rf"
  - "sudo"
  - "git reset --hard"

herdr:
  cli_path: herdr
  default_source: recent-unwrapped
  command_timeout_seconds: 20

approval:
  codex:
    method: send_text_enter
    text: "y"
  claude:
    method: send_keys
    keys: ["Enter"]
  pi:
    method: send_keys
    keys: ["Enter"]
deny:
  codex:
    method: send_keys
    keys: ["Escape"]
  claude:
    method: send_keys
    keys: ["Escape"]
  pi:
    method: send_keys
    keys: ["Escape"]
stop:
  method: send_keys
  keys: ["C-c"]
