allowed_guild_ids: []
allowed_channel_ids: []
allowed_user_ids: []
thread_parent_channel_id: null

database_path: herdrelay.sqlite3

max_output_chars: 1800
max_message_chars: 2000

enable_send: false
enable_approve: false
enable_watcher: false
enable_stop: false
enable_auto_threads: false
enable_streaming: false
allow_pane_send_fallback: false
submit_after_agent_send: true
submit_after_agent_send_delay_seconds: 0.5

auto_threads:
  refresh_seconds: 30

streaming:
  refresh_seconds: 8
  tail_lines: 60

watcher:
  statuses: ["blocked", "done"]
  reconnect_delay_seconds: 5
  resubscribe_interval_seconds: 300
  blocked_tail_lines: 80
  done_tail_lines: 60
dangerous_text_blocklist:
  - "rm -rf"
  - "sudo"
  - "git reset --hard"

herdr:
  cli_path: herdr
  default_source: recent-unwrapped
  command_timeout_seconds: 20

approval:
  codex:
    method: send_text_enter
    text: "y"
  claude:
    method: send_keys
    keys: ["Enter"]
  pi:
    method: send_keys
    keys: ["Enter"]
deny:
  codex:
    method: send_keys
    keys: ["Escape"]
  claude:
    method: send_keys
    keys: ["Escape"]
  pi:
    method: send_keys
    keys: ["Escape"]
stop:
  method: send_keys
  keys: ["C-c"]
