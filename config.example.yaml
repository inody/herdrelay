runtime:
  provider: herdr-tui             # herdr-tui, herdr-core, or orca
  herdr_tui:
    cli_path: herdr
    default_source: recent-unwrapped
    command_timeout_seconds: 20
    target_exposure:
      mode: all-eligible          # all-eligible, selected, or none
      # selected mode only:
      addresses: []               # exact pane IDs
  herdr_core:
    socket_path: null             # existing Core only; HerdRelay never starts it
    connect_timeout_seconds: 5
    request_timeout_seconds: 20
    event_idle_timeout_seconds: 35 # Core heartbeats every 15s
    require_app_visible: true
    include_hidden_workers: false
    include_connected_machines: false
    target_exposure:
      mode: all-eligible          # all-eligible, selected, or none
      # selected mode only:
      addresses: []               # exact terminal addresses
      addresses_file: null        # optional local 0600 file managed by herdrelay-targets
  orca:                          # public-CLI backend for local terminal agents
    cli_path: orca
    environment: local
    command_timeout_seconds: 10
    refresh_seconds: 2
    send_wait_seconds: 5       # observe submission without retrying input
    include_terminal_agents: true
    include_chats: false          # no documented safe prompt path yet
    host_ids: [local]
    target_exposure:
      mode: all-eligible          # all eligible agents on host_ids
      # selected mode only; pane and worktree selectors are ORed:
      pane_keys: []
      worktree_ids: []

storage:
  database_path: herdrelay.sqlite3

relay:
  max_output_chars: 1800
  max_message_chars: 2000
  enable_streaming: false
  dangerous_text_blocklist:
    - "rm -rf"
    - "sudo"
    - "git reset --hard"
  general:
    enabled: false                 # Telegram General and Discord parent channel
    provider: auto                 # auto, router, or orca-bot
    activation: all-text
    execution_policy: auto-unique
    general_topic_id: null         # set only if Telegram reports one explicitly
    context_ttl_seconds: 0         # router only; 0 disables recent-target context
    model:                         # auto uses this for hc/herdr
      provider: none               # openai-compatible, pi-cli, or command
      model: null
      base_url: null
      api_key_env: null
      cli_path: pi                 # pi-cli uses existing Pi authentication
      node_path: null              # stable Node path for launchd if needed
      pass_env: []                 # extra credential env names
      extensions: []               # explicitly trusted provider extensions
      argv: []                     # command provider; executed without a shell
      timeout_seconds: 5
      max_output_bytes: 16384
    orca_bot:                      # auto uses this for Orca
      bot_id: null                 # exact ID from `orca bot list --json`
      queue_path: ~/.cache/herdrelay/orca-bot-gateway
      gateway_worktree: null       # exact folder:/id or worktree selector
      gateway_title: HerdRelay Gateway
      gateway_command: null        # command run inside the dedicated Orca terminal
      refresh_seconds: 1
      heartbeat_stale_seconds: 15
      command_timeout_seconds: 20
  streaming:
    mode: hooks                    # hooks (recommended) or poll
    refresh_seconds: 8             # poll mode only
    tail_lines: 1000               # poll mode only
    initial_tail_lines: 60         # poll mode only
    enable_visible_fallback: true  # poll mode only
    hook_inbox_path: ~/.cache/herdrelay/agent-output
    hook_refresh_seconds: 1
    hook_max_event_bytes: 2000000
    hook_max_event_age_seconds: 86400

transports:
  discord:
    enabled: true                  # backward-compatible default
    allowed_guild_ids: []
    allowed_channel_ids: []
    allowed_user_ids: []
    thread_parent_channel_id: null # normal text here uses relay.general
    target_absence_grace_seconds: 60
    closed_thread_retention_minutes: 10 # null keeps archived threads indefinitely
    enable_send: false
    enable_questions: false        # legacy TUI structured answers only
    enable_watcher: false
    enable_interrupt: false        # guarded native interrupt; Core only
    enable_auto_threads: false
    allow_pane_send_fallback: false
    auto_threads:
      refresh_seconds: 30
    watcher:
      statuses: [blocked, done]
      reconnect_delay_seconds: 5
      resubscribe_interval_seconds: 300
      include_output: true
      blocked_notification_delay_seconds: 1.5
      blocked_tail_lines: 80
      done_tail_lines: 60
  telegram:
    enabled: false
    mode: forum
    allowed_chat_ids: []
    allowed_user_ids: []
    forum_chat_id: null
    statuses: [blocked, done]
    enable_send: false
    enable_interrupt: false        # Core-only, with one-time confirmation
    confirmation_ttl_seconds: 60
    actor_mutations_per_minute: 6
    chat_mutations_per_minute: 12
    target_mutations_per_minute: 6
    poll_timeout_seconds: 25
    request_timeout_seconds: 35
    reconnect_delay_seconds: 5
    status_refresh_seconds: 5      # legacy TUI/Orca polling; Core uses native events
    target_absence_grace_seconds: 60 # ignore transient discovery gaps
    closed_topic_retention_minutes: 10 # null keeps closed topics indefinitely
    voice_input:
      enabled: false               # transcribe Telegram voice messages in General
      scope: general               # or general-and-bound for direct topic voice
      max_duration_seconds: 120
      max_file_bytes: 10000000
      transcription:
        provider: none             # mlx-whisper or command
        model: null                # e.g. mlx-community/whisper-large-v3-turbo
        language: smart            # auto, ja, en, or smart retry mode
        python_path: python3        # Python containing mlx-whisper
        argv: []                   # command provider; use {input} placeholder
        pass_env: []               # extra env names; minimal by default
        timeout_seconds: 120
        max_output_bytes: 1048576
